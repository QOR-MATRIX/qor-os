version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type: ci", "dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "chore"
    ignore:
      # Formatter upgrades reformat the codebase and must move together with
      # the pre-commit mirror rev; upgrade deliberately (docs/DEVELOPMENT.md).
      - dependency-name: "clang-format"
