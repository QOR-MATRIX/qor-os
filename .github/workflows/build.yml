name: Build

# Builds and tests QOR OS with the commercial Qt 6.12 kit on Windows and Linux:
# the OS itself, the QOR core from demiurge-chain at its pinned commit (core/,
# needs cargo), and on Windows the products carried from demiurge-chain (QQ,
# ARQADE, QOR Media) through their own build scripts.
#
# Each OS job runs when it has a Qt source (first match wins):
#   1. Repository variable QOR_WINDOWS_QT_DIR / QOR_LINUX_QT_DIR
#      - a Qt kit already installed on a self-hosted runner
#   2. Secrets QT_INSTALLER_JWT_TOKEN, or QT_INSTALLER_EMAIL + QT_INSTALLER_PASSWORD
#      - unattended Qt Online Installer on a hosted runner, cached
# Runner selection: repository variables QOR_WINDOWS_RUNNER / QOR_LINUX_RUNNER
# take a JSON runner label, e.g. '["self-hosted","windows","qt"]'.
# Set QOR_RUN_GPU_TESTS=true on a runner with a desktop session to also run
# the GPU-labelled suites. See docs/CI.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch. A newer push supersedes an older build, including one
# still queued for a self-hosted runner that is offline, which would otherwise
# hold every later build behind it. Tag builds always run to completion.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QOR_QT_VERSION: '6.12.0'
  # Both jobs run on one laptop, which someone also uses, with 20 threads and 16 GB. Left to itself each build starts 22
  # compilers at once, and two full ones were running when it crashed on 31 October (docs/CI.md). The Linux job also waits
  # for the Windows one, below.
  CMAKE_BUILD_PARALLEL_LEVEL: '8'
  CARGO_BUILD_JOBS: '8'

jobs:
  preflight:
    name: Qt availability
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.check.outputs.windows }}
      linux: ${{ steps.check.outputs.linux }}
    steps:
      - id: check
        env:
          HAS_WINDOWS_KIT: ${{ vars.QOR_WINDOWS_QT_DIR != '' }}
          HAS_LINUX_KIT: ${{ vars.QOR_LINUX_QT_DIR != '' }}
          HAS_SECRETS: ${{ secrets.QT_INSTALLER_JWT_TOKEN != '' || (secrets.QT_INSTALLER_EMAIL != '' && secrets.QT_INSTALLER_PASSWORD != '') }}
        run: |
          windows=false; linux=false
          { [ "$HAS_WINDOWS_KIT" = "true" ] || [ "$HAS_SECRETS" = "true" ]; } && windows=true
          { [ "$HAS_LINUX_KIT" = "true" ] || [ "$HAS_SECRETS" = "true" ]; } && linux=true
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          {
            echo "### Qt builds"
            echo "| Platform | Qt source | Runs |"
            echo "|----------|-----------|------|"
            echo "| Windows | $([ "$HAS_WINDOWS_KIT" = "true" ] && echo "self-hosted kit" || ([ "$HAS_SECRETS" = "true" ] && echo "online installer" || echo "none")) | $windows |"
            echo "| Linux | $([ "$HAS_LINUX_KIT" = "true" ] && echo "self-hosted kit" || ([ "$HAS_SECRETS" = "true" ] && echo "online installer" || echo "none")) | $linux |"
            echo
            echo "Configure a Qt source per platform to enable its job. See docs/CI.md."
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows · MSVC 2022
    needs: preflight
    # A dependency update waits for a person: Dependabot's pull requests never run on the workstation (docs/CI.md).
    if: needs.preflight.outputs.windows == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.QOR_WINDOWS_RUNNER || '"windows-2025"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Self-hosted runners keep the build tree for incremental builds.
          clean: ${{ vars.QOR_WINDOWS_QT_DIR == '' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: vars.QOR_WINDOWS_QT_DIR == ''
        with:
          python-version: '3.12'

      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
        if: vars.QOR_WINDOWS_QT_DIR == ''

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Restore Qt
        id: qt-cache
        if: vars.QOR_WINDOWS_QT_DIR == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ runner.os }}-${{ env.QOR_QT_VERSION }}-${{ hashFiles('.github/qt-packages.json') }}

      - name: Install Qt (commercial)
        if: vars.QOR_WINDOWS_QT_DIR == '' && steps.qt-cache.outputs.cache-hit != 'true'
        env:
          QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
          QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
          QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
        run: python tools/ci/install_qt.py --platform windows --root "${{ runner.temp }}/Qt"

      - name: Select Qt kit and tools
        shell: pwsh
        run: |
          $kit = if ('${{ vars.QOR_WINDOWS_QT_DIR }}') { '${{ vars.QOR_WINDOWS_QT_DIR }}' } else { "${{ runner.temp }}/Qt/$env:QOR_QT_VERSION/msvc2022_64" }
          "QOR_QT_DIR=$kit" >> $env:GITHUB_ENV
          "$kit/bin" >> $env:GITHUB_PATH
          # Qt's bundled CMake and Ninja, when the kit comes from a full Qt install.
          $root = Join-Path $kit '../..'
          foreach ($tool in 'Tools/CMake_64/bin', 'Tools/Ninja') {
            $dir = Join-Path $root $tool
            if (Test-Path $dir) { (Resolve-Path $dir).Path >> $env:GITHUB_PATH }
          }

      # A machine that stops in the middle of a build can leave an object empty, with a new date, which Ninja takes as built
      # (docs/CI.md). Such an object is built again.
      - name: What a stopped machine left
        shell: pwsh
        run: if (Test-Path build) { Get-ChildItem build -Recurse -File -Filter *.obj | Where-Object Length -eq 0 | ForEach-Object { $_.FullName; Remove-Item $_.FullName } }

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      # What came out has the mitigations cmake/QorHardening.cmake asks for (QOR-0018).
      - name: Exploit mitigations
        run: python tools/ci/check_hardening.py build/ci-windows

      - name: qmllint
        run: cmake --build --preset ci-windows --target all_qmllint

      - name: Test
        run: ctest --preset ci-windows -LE gpu

      - name: Test (GPU)
        id: gpu-tests
        if: vars.QOR_RUN_GPU_TESTS == 'true'
        run: ctest --preset ci-windows -L gpu --timeout 120 --repeat until-pass:2

      - name: Upload golden-image differences
        if: failure() && steps.gpu-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-diff-windows
          path: build/ci-windows/tests/golden-out
          retention-days: 7

      # The products' suites take about ten minutes and drive real windows on
      # the runner's desktop, so they run when the carried code (or how it is
      # built) changed, on tags and on manual runs.
      - name: Did the carried products change?
        id: products
        if: vars.QOR_RUN_GPU_TESTS == 'true'
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $run = $true
          if ($env:EVENT -in 'push', 'pull_request' -and $env:BEFORE -and $env:BEFORE -notmatch '^0+$' -and -not $env:GITHUB_REF.StartsWith('refs/tags/')) {
            git fetch --quiet --no-tags --depth=1 origin $env:BEFORE
            $changed = git diff --name-only $env:BEFORE HEAD
            $run = [bool]($changed | Where-Object { $_ -match '^(products/|tools/qor-media/|docs/design/tokens\.json$|tools/dev/products\.ps1$|\.github/workflows/build\.yml$)' })
          }
          "run=$($run.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Carried products: $(if ($run) { 'built and tested' } else { 'unchanged, skipped' })" >> $env:GITHUB_STEP_SUMMARY

      # Each product's own script builds and tests it, exactly as upstream
      # (docs/UPSTREAM.md); a product that fails is tried once more.
      - name: Products (QQ, ARQADE, QOR Media)
        if: steps.products.outputs.run == 'true'
        shell: pwsh
        run: .\tools\dev\products.ps1 -Qt $env:QOR_QT_DIR -BuildRoot build\ci-products

      - name: Exploit mitigations (the products)
        if: steps.products.outputs.run == 'true'
        run: python tools/ci/check_hardening.py build/ci-products

      - name: Package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cmake --install build/ci-windows --prefix dist/qor-os

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: qor-os-windows-x64
          path: dist/qor-os
          retention-days: 7

  linux:
    name: Linux · GCC
    # After the Windows job, whatever became of it: one machine, one job at a time (docs/CI.md).
    needs: [preflight, windows]
    # A dependency update waits for a person: Dependabot's pull requests never run on the workstation (docs/CI.md).
    if: ${{ !cancelled() && needs.preflight.outputs.linux == 'true' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ fromJSON(vars.QOR_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ vars.QOR_LINUX_QT_DIR == '' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: vars.QOR_LINUX_QT_DIR == ''
        with:
          python-version: '3.12'

      - name: System packages
        if: vars.QOR_LINUX_QT_DIR == ''
        run: |
          sudo apt-get update
          # libdbus-1-dev: the QOR core's keychain uses the Secret Service over D-Bus.
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libfreetype-dev libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libwayland-dev libpulse0 \
            libssl-dev libdbus-1-dev pkg-config

      - name: Restore Qt
        id: qt-cache
        if: vars.QOR_LINUX_QT_DIR == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ runner.os }}-${{ env.QOR_QT_VERSION }}-${{ hashFiles('.github/qt-packages.json') }}

      - name: Install Qt (commercial)
        if: vars.QOR_LINUX_QT_DIR == '' && steps.qt-cache.outputs.cache-hit != 'true'
        env:
          QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
          QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
          QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
        run: python tools/ci/install_qt.py --platform linux --root "${{ runner.temp }}/Qt"

      - name: Select Qt kit and tools
        run: |
          kit="${{ vars.QOR_LINUX_QT_DIR }}"
          [ -n "$kit" ] || kit="${{ runner.temp }}/Qt/${QOR_QT_VERSION}/gcc_64"
          echo "QOR_QT_DIR=$kit" >> "$GITHUB_ENV"
          echo "$kit/bin" >> "$GITHUB_PATH"
          for tool in Tools/CMake/bin Tools/Ninja; do
            [ -d "$kit/../../$tool" ] && realpath "$kit/../../$tool" >> "$GITHUB_PATH"
          done
          true

      # A machine that stops in the middle of a build can leave an object empty, with a new date, which Ninja takes as built
      # (docs/CI.md). Such an object is built again.
      - name: What a stopped machine left
        run: if [ -d build ]; then find build -name '*.o' -size 0 -print -delete; fi

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      # What came out has the mitigations cmake/QorHardening.cmake asks for (QOR-0018).
      - name: Exploit mitigations
        run: python3 tools/ci/check_hardening.py build/ci-linux

      - name: qmllint
        run: cmake --build --preset ci-linux --target all_qmllint

      - name: Test
        run: ctest --preset ci-linux -LE gpu

      # The same suites under AddressSanitizer and UBSan, in a build folder of their own (QOR-0018).
      - name: Sanitizers
        run: |
          cmake --preset linux-asan
          cmake --build --preset linux-asan
          ctest --preset linux-asan -LE gpu --timeout 300

      - name: Test (GPU)
        id: gpu-tests
        if: vars.QOR_RUN_GPU_TESTS == 'true'
        run: |
          # Without a reachable display the suites would wait for a window
          # forever; fail with the reason instead.
          socket="${WAYLAND_DISPLAY:-}"
          case "$socket" in "" | /*) ;; *) socket="${XDG_RUNTIME_DIR:-}/$socket" ;; esac
          if [ -n "$socket" ] && [ ! -S "$socket" ]; then
            echo "::error::Wayland display socket $socket does not exist. See docs/CI.md (Linux runner in WSL2)."
            exit 1
          fi
          ctest --preset ci-linux -L gpu --timeout 120 --repeat until-pass:2

      - name: Upload golden-image differences
        if: failure() && steps.gpu-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-diff-linux
          path: build/ci-linux/tests/golden-out
          retention-days: 7

      # Real Wayland clients against the built compositor; needs a display
      # (WSLg or a desktop session), weston and wayland-utils on the runner.
      - name: Prism protocol check
        if: vars.QOR_RUN_GPU_TESTS == 'true' && vars.QOR_LINUX_QT_DIR != ''
        run: tools/dev/prism-protocol-check.sh build/ci-linux

      # The carried products on Linux, as on Windows: when the carried code (or
      # how it is built) changed, on tags and on manual runs. Only where
      # QOR_RUN_LINUX_PRODUCTS says so: on 28 October their GPU suites under
      # WSL froze the PC the runner shares (docs/CI.md#the-carried-products).
      - name: Did the carried products change?
        id: products
        if: vars.QOR_RUN_GPU_TESTS == 'true' && vars.QOR_RUN_LINUX_PRODUCTS == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && [ -n "$BEFORE" ] \
              && ! echo "$BEFORE" | grep -qE '^0+$' && [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE"
            git diff --name-only "$BEFORE" HEAD \
              | grep -qE '^(products/|tools/qor-media/|docs/design/tokens\.json$|tools/dev/products(\.sh|-display\.qml)$|\.github/workflows/build\.yml$|\.github/qt-packages\.json$)' \
              || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Carried products: $([ "$run" = true ] && echo 'built and tested' || echo 'unchanged, skipped')" >> "$GITHUB_STEP_SUMMARY"

      - name: Products (QQ, ARQADE, QOR Media)
        if: steps.products.outputs.run == 'true'
        run: tools/dev/products.sh --qt "$QOR_QT_DIR" --build-root build/ci-products
