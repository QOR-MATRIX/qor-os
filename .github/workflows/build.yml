name: Build

# Builds and tests QTOS with the commercial Qt 6.12 kit on Windows and Linux.
#
# Each OS job runs when it has a Qt source (first match wins):
#   1. Repository variable QTOS_WINDOWS_QT_DIR / QTOS_LINUX_QT_DIR
#      - a Qt kit already installed on a self-hosted runner
#   2. Secrets QT_INSTALLER_JWT_TOKEN, or QT_INSTALLER_EMAIL + QT_INSTALLER_PASSWORD
#      - unattended Qt Online Installer on a hosted runner, cached
# Runner selection: repository variables QTOS_WINDOWS_RUNNER / QTOS_LINUX_RUNNER
# take a JSON runner label, e.g. '["self-hosted","windows","qt"]'.
# Set QTOS_RUN_GPU_TESTS=true on a runner with a desktop session to also run
# the GPU-labelled suites. See docs/CI.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QTOS_QT_VERSION: '6.12.0'

jobs:
  preflight:
    name: Qt availability
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.check.outputs.windows }}
      linux: ${{ steps.check.outputs.linux }}
    steps:
      - id: check
        env:
          HAS_WINDOWS_KIT: ${{ vars.QTOS_WINDOWS_QT_DIR != '' }}
          HAS_LINUX_KIT: ${{ vars.QTOS_LINUX_QT_DIR != '' }}
          HAS_SECRETS: ${{ secrets.QT_INSTALLER_JWT_TOKEN != '' || (secrets.QT_INSTALLER_EMAIL != '' && secrets.QT_INSTALLER_PASSWORD != '') }}
        run: |
          windows=false; linux=false
          { [ "$HAS_WINDOWS_KIT" = "true" ] || [ "$HAS_SECRETS" = "true" ]; } && windows=true
          { [ "$HAS_LINUX_KIT" = "true" ] || [ "$HAS_SECRETS" = "true" ]; } && linux=true
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          {
            echo "### Qt builds"
            echo "| Platform | Qt source | Runs |"
            echo "|----------|-----------|------|"
            echo "| Windows | $([ "$HAS_WINDOWS_KIT" = "true" ] && echo "self-hosted kit" || ([ "$HAS_SECRETS" = "true" ] && echo "online installer" || echo "none")) | $windows |"
            echo "| Linux | $([ "$HAS_LINUX_KIT" = "true" ] && echo "self-hosted kit" || ([ "$HAS_SECRETS" = "true" ] && echo "online installer" || echo "none")) | $linux |"
            echo
            echo "Configure a Qt source per platform to enable its job. See docs/CI.md."
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows · MSVC 2022
    needs: preflight
    if: needs.preflight.outputs.windows == 'true'
    runs-on: ${{ fromJSON(vars.QTOS_WINDOWS_RUNNER || '"windows-2025"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Self-hosted runners keep the build tree for incremental builds.
          clean: ${{ vars.QTOS_WINDOWS_QT_DIR == '' }}

      - uses: actions/setup-python@v7
        if: vars.QTOS_WINDOWS_QT_DIR == ''
        with:
          python-version: '3.12'

      - uses: seanmiddleditch/gha-setup-ninja@v6
        if: vars.QTOS_WINDOWS_QT_DIR == ''

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Qt
        id: qt-cache
        if: vars.QTOS_WINDOWS_QT_DIR == ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ runner.os }}-${{ env.QTOS_QT_VERSION }}-${{ hashFiles('.github/qt-packages.json') }}

      - name: Install Qt (commercial)
        if: vars.QTOS_WINDOWS_QT_DIR == '' && steps.qt-cache.outputs.cache-hit != 'true'
        env:
          QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
          QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
          QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
        run: python tools/ci/install_qt.py --platform windows --root "${{ runner.temp }}/Qt"

      - name: Select Qt kit and tools
        shell: pwsh
        run: |
          $kit = if ('${{ vars.QTOS_WINDOWS_QT_DIR }}') { '${{ vars.QTOS_WINDOWS_QT_DIR }}' } else { "${{ runner.temp }}/Qt/$env:QTOS_QT_VERSION/msvc2022_64" }
          "QTOS_QT_DIR=$kit" >> $env:GITHUB_ENV
          "$kit/bin" >> $env:GITHUB_PATH
          # Qt's bundled CMake and Ninja, when the kit comes from a full Qt install.
          $root = Join-Path $kit '../..'
          foreach ($tool in 'Tools/CMake_64/bin', 'Tools/Ninja') {
            $dir = Join-Path $root $tool
            if (Test-Path $dir) { (Resolve-Path $dir).Path >> $env:GITHUB_PATH }
          }

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      - name: qmllint
        run: cmake --build --preset ci-windows --target all_qmllint

      - name: Test
        run: ctest --preset ci-windows -LE gpu

      - name: Test (GPU)
        id: gpu-tests
        if: vars.QTOS_RUN_GPU_TESTS == 'true'
        run: ctest --preset ci-windows -L gpu

      - name: Upload golden-image differences
        if: failure() && steps.gpu-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-windows
          path: build/ci-windows/tests/golden-out
          retention-days: 7

      - name: Package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cmake --install build/ci-windows --prefix dist/qtos

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: qtos-windows-x64
          path: dist/qtos
          retention-days: 7

  linux:
    name: Linux · GCC
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ${{ fromJSON(vars.QTOS_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ vars.QTOS_LINUX_QT_DIR == '' }}

      - uses: actions/setup-python@v7
        if: vars.QTOS_LINUX_QT_DIR == ''
        with:
          python-version: '3.12'

      - name: System packages
        if: vars.QTOS_LINUX_QT_DIR == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libfreetype-dev libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libwayland-dev

      - name: Restore Qt
        id: qt-cache
        if: vars.QTOS_LINUX_QT_DIR == ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ runner.os }}-${{ env.QTOS_QT_VERSION }}-${{ hashFiles('.github/qt-packages.json') }}

      - name: Install Qt (commercial)
        if: vars.QTOS_LINUX_QT_DIR == '' && steps.qt-cache.outputs.cache-hit != 'true'
        env:
          QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
          QT_INSTALLER_EMAIL: ${{ secrets.QT_INSTALLER_EMAIL }}
          QT_INSTALLER_PASSWORD: ${{ secrets.QT_INSTALLER_PASSWORD }}
        run: python tools/ci/install_qt.py --platform linux --root "${{ runner.temp }}/Qt"

      - name: Select Qt kit and tools
        run: |
          kit="${{ vars.QTOS_LINUX_QT_DIR }}"
          [ -n "$kit" ] || kit="${{ runner.temp }}/Qt/${QTOS_QT_VERSION}/gcc_64"
          echo "QTOS_QT_DIR=$kit" >> "$GITHUB_ENV"
          echo "$kit/bin" >> "$GITHUB_PATH"
          for tool in Tools/CMake/bin Tools/Ninja; do
            [ -d "$kit/../../$tool" ] && realpath "$kit/../../$tool" >> "$GITHUB_PATH"
          done
          true

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      - name: qmllint
        run: cmake --build --preset ci-linux --target all_qmllint

      - name: Test
        run: ctest --preset ci-linux -LE gpu
