name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Tokens, headers, formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Lumen tokens are generated and current
        run: python tools/tokens/generate_tokens.py --check

      - name: Token generator tests
        run: python -m unittest discover -s tests/tools -v

      - name: Store catalogue is signed and matches its content
        run: python tools/store/build_store.py check

      - name: SPDX license headers
        run: python tools/ci/check_headers.py

      - name: clang-format (pinned in requirements-dev.txt)
        run: |
          git ls-files '*.cpp' '*.h' ':!:platform/common/lumentokens.h' ':!:sdk/**' \
            | xargs clang-format --dry-run --Werror

      - name: JSON is valid
        run: |
          git ls-files '*.json' | while read -r f; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
