name: Feature proposal
description: Propose a capability for QOR OS (shell, games, QQ, apps, services, platform).
title: "[Feature] "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't people do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The experience you want. Mockups, sketches and references are welcome.
    validations:
      required: true
  - type: textarea
    id: qt
    attributes:
      label: Qt building blocks
      description: Which Qt modules or tools would this use? (See docs/QT-MODULES.md.)
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - "Phase 1 · One stack"
        - "Phase 2 · Identity and keys"
        - "Phase 3 · Boots and plays PC games"
        - "Phase 4 · The ecosystem"
        - Not sure
  - type: checkboxes
    id: principles
    attributes:
      label: Principles check
      description: See VISION.md §1.
      options:
        - label: Works with Reduce Motion and Reduce Transparency
        - label: Renders on demand (no constant frames when idle)
        - label: Keyboard, controller and screen-reader accessible
