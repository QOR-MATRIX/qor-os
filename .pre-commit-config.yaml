# Install once:  python -m pip install -r requirements-dev.txt && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: mixed-line-ending
        exclude: '\.ps1$'

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: lumen-tokens
        name: Lumen tokens are generated
        entry: python tools/tokens/generate_tokens.py --check
        language: system
        pass_filenames: false
        files: '^(kit/tokens/|tools/tokens/|kit/Tokens\.qml|platform/common/lumentokens\.h|docs/design/tokens\.md)'
      - id: spdx-headers
        name: SPDX license headers
        entry: python tools/ci/check_headers.py
        language: system
        pass_filenames: false
        files: '\.(cpp|h|qml|frag|js)$'
