# Install once:  python -m pip install -r requirements-dev.txt && pre-commit install
# Run on demand: pre-commit run --all-files

# Vendored third-party assets, generated files, and the products from
# demiurge-chain, which keep their own form (QOR-0015, docs/UPSTREAM.md), are
# never rewritten by hooks.
exclude: '^(kit/fonts/|kit/icons/|prism/compositor/protocols/|kit/Tokens\.qml$|platform/common/lumentokens\.h$|docs/design/tokens\.(md|json)$|store/catalog/|tests/store/fixtures/|products/|tools/qor-media/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        # Qt Application Manager manifests are multi-document YAML.
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: mixed-line-ending
        exclude: '\.ps1$'

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: '^sdk/'

  - repo: local
    hooks:
      - id: lumen-tokens
        name: Lumen tokens are generated
        entry: python tools/tokens/generate_tokens.py --check
        language: system
        pass_filenames: false
        files: '^(kit/tokens/|tools/tokens/|kit/Tokens\.qml|platform/common/lumentokens\.h|docs/design/tokens\.md)'
      - id: spdx-headers
        name: SPDX license headers
        entry: python tools/ci/check_headers.py
        language: system
        pass_filenames: false
        files: '\.(cpp|h|qml|frag|js)$'
