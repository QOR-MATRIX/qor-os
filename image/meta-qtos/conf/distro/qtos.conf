# QTOS distribution policy.
require conf/distro/poky.conf

DISTRO = "qtos"
DISTRO_NAME = "QTOS"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "lumen"
MAINTAINER = "QOR-MATRIX"

INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"

DISTRO_FEATURES:append = " wayland opengl vulkan pam systemd usrmerge seccomp"
DISTRO_FEATURES:remove = "x11 sysvinit"

# Read-only, verified root filesystem; user data lives on a separate btrfs
# partition (see docs/VISION.md §3). Enabled once dm-verity is wired up.
# IMAGE_FEATURES += "read-only-rootfs"
